appId: io.durumi.app
productName: Durumi
directories:
  output: dist-build
files:
  - "out/**"
  - "package.json"
publish:
  provider: github
  owner: kimmingul
  repo: durumi
  channel: latest
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  icon: build/icon.png
  # ────────────────────────────────────────────────────────────────────
  # Real signing, activated 2026-07-31 (was ad-hoc: `identity: null` +
  # `hardenedRuntime: false`). The ad-hoc build was not merely
  # "warned about" — macOS actively BLOCKED it:
  #
  #   $ spctl -a -vv Durumi.app
  #   notarization indicates this code has been revoked
  #
  # Apple revoked the ad-hoc-signed Electron 31.7.7 macOS binaries, and
  # Durumi bundles them, so every download was quarantined as malware and
  # moved to the Trash on macOS 26 / XProtect 5353. Verified against
  # v0.2.29 and v0.2.30 DMGs and against the stock Electron binary from
  # npm — a benign ad-hoc-signed control app returns only `rejected`,
  # so `revoked` is specific, not the generic unsigned verdict.
  #
  # `identity` is intentionally absent: electron-builder then auto-selects
  # the "Developer ID Application" certificate from the keychain (local)
  # or from CSC_LINK (CI).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false  # default; kept explicit for review clarity
  # `notarize: true` alone is NOT enough on electron-builder 24.13.3 — it does
  # not forward APPLE_TEAM_ID to @electron/notarize, which then fails with
  # "The teamId property is required when using notarization with password
  # credentials". The object form passes it explicitly.
  #
  # teamId is not a secret: it is embedded in every signed binary
  # (`codesign -dvvv` → TeamIdentifier) and in the certificate subject.
  # APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD still come from env/secrets.
  notarize:
    teamId: XB673TQF3A
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # ────────────────────────────────────────────────────────────────────
  # Windows signing is EXTERNAL to electron-builder (since 2026-08-01).
  #
  # The certificate is a GlobalSign EV code-signing cert whose private key
  # lives on a SafeNet USB token. An EV key cannot leave the token, so
  # GitHub Actions cannot sign — the CI job produces an UNSIGNED NSIS and a
  # human signs it locally, then replaces the release asset.
  # Full procedure: docs/RELEASE.md → "Windows signing (EV token, external)".
  #
  # Because electron-builder never sees the certificate, it cannot derive
  # the publisher name for `app-update.yml` on its own — `publisherName`
  # below MUST be set manually and MUST match the certificate CN exactly,
  # or electron-updater rejects every future update as unsigned.
  #   $ openssl x509 -in leaf.pem -noout -subject -nameopt multiline
  #     commonName = Nanum Space Co,. Ltd
  publisherName: "Nanum Space Co,. Ltd"
  # Safe to enable now: v0.2.30 shipped with this `false`, so the flag only
  # takes effect for clients running v0.2.31+. Verify on a real Windows box
  # during the first update cycle that actually exercises it.
  verifyUpdateCodeSignature: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
